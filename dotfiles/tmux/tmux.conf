set-option -g terminal-overrides ',*:RGB'

# Enable hyperlink passthrough (OSC 8) so terminal can render clickable links
set -as terminal-features ',xterm-ghostty:hyperlinks'
set -g allow-passthrough all

# start indexing at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# set vi mode
set-window-option -g mode-keys vi

# keybindings
bind-key -T copy-mode-vi 'v' send-key -X begin-selection
bind-key -T copy-mode-vi 'V' send-key -X select-line
bind-key -T copy-mode-vi 'C-v' send-key -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send-key -X copy-selection-and-cancel

set -g extended-keys on

set -g prefix C-Space
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g default-terminal "tmux-256color"
setw -g mode-keys vi
set -g mouse on
set -ga update-environment " TERM_PROGRAM TERM_PROGRAM_VERSION"
set -g pane-active-border-style 'fg=#74c7ec,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL " --tac'
set -g @fzf-url-history-limit '2000'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-key T
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'F'
set -g @floax-change-path 'true'
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-custom-paths '~/linuxConfig/dotfiles'
set -g @sessionx-bind 'g'
set -g @sessionx-x-path '~/linuxConfig/dotfiles'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-filter-current 'false'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-strategy-nvim 'session'

set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.config/tmux/plugins/tpm/tpm'

# ── Overrides (after TPM to take final priority) ──
# Transparent status bar
set -g status-bg default
set -g status-style 'bg=default'
set -gw window-status-style 'bg=default'
set -gw window-status-current-style 'bg=default'
set -gw window-status-activity-style 'bg=default'
set -g message-style 'bg=default,fg=#cdd6f4'
set -g message-command-style 'bg=default,fg=#cdd6f4'

# Status left — session in square block, vibrant bg on prefix
set -g status-left-length 30
set -g status-left "#{?client_prefix,#[bg=#f9e2af fg=#1e1e2e bold] #S #[bg=default],#[bg=default fg=#cdd6f4 bold] #S }#[fg=#585b70]│ "

# Windows — plain text, active gets vibrant color
set -g window-status-format "#[fg=#6c7086,bg=default] #I. #W "
set -g window-status-current-format "#[fg=#f9e2af,bg=default,bold] #I. #W#{?window_zoomed_flag, 󰊓,} "
set -g window-status-separator "#[fg=#585b70]│"

# Status right
set -g status-right-length 50
set -g status-right "#[fg=#585b70]│ #[fg=#cdd6f4,bg=default]#{b:pane_current_path} #[fg=#585b70]│ #[fg=#cdd6f4]%H:%M "
# ── Window Management ─────────────────────────────
bind ^C   new-window -c "#{pane_current_path}"
bind H    previous-window
bind L    next-window
bind ^A   last-window
bind ^W   list-windows
bind R    source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# ── Pane Splitting (current directory) ────────────
bind v    split-window -h  -c "#{pane_current_path}"
bind s    split-window -v  -c "#{pane_current_path}"

# ── Pane Navigation (no prefix) ──────────────────
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
unbind C-l
bind -n C-l select-pane -R

# ── Session / Utility ─────────────────────────────
bind ^D   detach
bind ^X   lock-server
bind S    choose-session
bind K    send-keys "clear" \; send-keys "Enter"
bind *    setw synchronize-panes

# ── Help ──────────────────────────────────────────
bind /    display-popup -E -w 40% -h 90% -T "TMUX CHEAT SHEET" "less --mouse ~/.config/tmux/cheatsheet.txt"

# ── Mouse / Scroll ────────────────────────────────
bind -n WheelUpPane   if-shell -F "#{alternate_on}" "send-keys -N 3 Up"   "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"
bind -n WheelDownPane if-shell -F "#{alternate_on}" "send-keys -N 3 Down" "send-keys -M"
bind-key -T root MouseDrag1Status swap-window -d -t=
