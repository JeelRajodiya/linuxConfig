# Additional keybindings — none of these override tmux defaults.
# All standard tmux bindings (c, n, p, l, w, s, x, ", %, etc.) remain intact.
# Prefix: C-Space (set in tmux.conf)

# ── Window Management ──────────────────────────────
bind ^C   new-window -c "#{pane_current_path}"
bind H    previous-window
bind L    next-window
bind ^A   last-window
bind ^W   list-windows
bind R    source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# ── Pane Splitting (current directory) ─────────────
bind v    split-window -h  -c "#{pane_current_path}"
bind |    split-window -h  -c "#{pane_current_path}"
bind _    split-window -v  -c "#{pane_current_path}"

# ── Session / Utility ──────────────────────────────
bind ^D   detach
bind ^X   lock-server
bind ^L   refresh-client
bind S    choose-session
bind K    send-keys "clear" \; send-keys "Enter"
bind *    setw synchronize-panes

# ── Help ───────────────────────────────────────────
bind /    display-popup -E -w 40% -h 90% -T "TMUX CHEAT SHEET" "less ~/.config/tmux/cheatsheet.txt"
